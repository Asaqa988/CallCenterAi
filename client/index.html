<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>شركة الحياة · المساعد الصوتي</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23A963FE'/%3E%3C/svg%3E"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    </div>

    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="6" fill="currentColor" />
          <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M16 3.5v3.2M16 25.3v3.2M3.5 16h3.2M25.3 16h3.2M7.2 7.2l2.3 2.3M22.5 22.5l2.3 2.3M24.8 7.2l-2.3 2.3M9.5 22.5l-2.3 2.3" />
          </g>
        </svg>
        <span class="sr-only" data-i18n="brand"></span>
      </div>
      <div class="top-actions">
        <button id="langBtn" class="chip" type="button"></button>
        <button id="themeBtn" class="icon-btn" type="button" data-i18n-label="theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <div class="masthead">
        <h1 id="title" class="company" data-i18n="brand"></h1>
        <p class="product" data-i18n="title"></p>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>

      <section class="hero" aria-labelledby="title">
        <div class="orb-wrap"><canvas id="orb" aria-hidden="true"></canvas></div>

        <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
          <span class="dot"></span><span id="statusText"></span>
        </div>

        <div class="controls">
          <button id="micBtn" class="icon-btn lg" type="button" disabled aria-pressed="false" data-i18n-label="mute">
            <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
            <svg class="i-mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M9 5.2V6a3 3 0 0 0 5.2 2M15 11v.5M5 11a7 7 0 0 0 11.6 5.2M19 11a7 7 0 0 1-.8 3.2M12 18v3" /></svg>
          </button>

          <button id="callBtn" class="call-btn" type="button" data-state="idle">
            <span class="call-label" id="callLabel"></span>
          </button>

          <div class="menu-wrap">
            <button id="settingsBtn" class="icon-btn lg" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-label="settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
            </button>
            <div id="menu" class="menu" hidden>
              <label for="micSelect" data-i18n="mic"></label>
              <select id="micSelect" disabled></select>
              <p class="hint" id="micHint" data-i18n="micHint"></p>
            </div>
          </div>
        </div>

        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section class="panel" aria-labelledby="panelTitle">
        <div class="panel-head">
          <h2 id="panelTitle" data-i18n="transcript"></h2>
          <button id="clearBtn" class="chip" type="button" data-i18n="clear"></button>
        </div>
        <ol id="log" class="log" aria-live="polite"></ol>
        <p id="empty" class="empty" data-i18n="empty"></p>
      </section>
    </main>

    <audio id="botAudio" autoplay></audio>
  </body>
</html>
